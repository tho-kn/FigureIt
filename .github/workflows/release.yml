name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to build, such as v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.2.0 or v0.2.0-beta.1." >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop:
    needs: [prepare, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch:tectonic
      - id: bundle
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: pnpm bundle
        env:
          FIGUREIT_VERSION: ${{ needs.prepare.outputs.version }}
      - name: Recover the Windows NSIS helper download
        if: runner.os == 'Windows' && steps.bundle.outcome == 'failure'
        shell: pwsh
        env:
          FIGUREIT_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $dll = Join-Path $env:LOCALAPPDATA 'tauri\NSIS\Plugins\x86-unicode\additional\nsis_tauri_utils.dll'
          New-Item -ItemType Directory -Force (Split-Path $dll) | Out-Null
          curl.exe --fail --location --retry 5 --retry-all-errors --output $dll https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll
          if ((Get-FileHash $dll -Algorithm SHA1).Hash -ne '75197FEE3C6A814FE035788D1C34EAD39349B860') { throw 'NSIS helper checksum mismatch.' }
          pnpm bundle
      - run: node scripts/collect-release.mjs "${{ matrix.target }}" "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: figureit-${{ matrix.target }}
          path: src-tauri/target/release-assets/*
          if-no-files-found: error
          retention-days: 7

  android:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri android init --ci
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: pnpm tauri android build --debug --apk --target aarch64 --ci --config '{"version":"${{ needs.prepare.outputs.version }}"}'
      - run: node scripts/collect-release.mjs android-arm64 "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: figureit-android-arm64
          path: src-tauri/target/release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: figureit-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and write checksums
        run: |
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 6
          cd release-assets
          sha256sum FigureIt-* > SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag --generate-notes --title "FigureIt $RELEASE_TAG"
          fi
          gh release view "$RELEASE_TAG" --json url --jq .url
