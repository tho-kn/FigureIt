[package]
name = "figureit"
version = "0.3.1"
description = "A visual TikZ figure editor"
authors = ["FigureIt"]
license = ""
repository = "https://github.com/tho-kn/FigureIt"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "figureit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
thiserror = "2"
